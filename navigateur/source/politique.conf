# Navigateur PuppyOS : politique du paquet (signé avec lui).
# Seule une mise à jour signée du Navigateur peut la changer.
#
# google_recherche=neutralisee : Google Recherche ne marche pas sous PuppyOS ;
#   les recherches Google partent vers DuckDuckGo, aucun mot n'est envoyé à
#   Google, une page locale explique, une rubrique d'aide aussi.
# google_recherche=normale : fonctionnement normal (aussi sans ce fichier).
google_recherche=neutralisee
