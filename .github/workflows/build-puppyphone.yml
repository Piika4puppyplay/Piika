name: Construire l'APK PuppyPhone
on:
  push:
    branches: [ puppyphone ]
  workflow_dispatch:
permissions:
  contents: write
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.7'
      - name: Polices puppyplay (hors ligne)
        run: |
          D=app/src/main/assets/www/fonts
          mkdir -p $D
          B=https://raw.githubusercontent.com/google/fonts/main/ofl
          for f in bungee/Bungee-Regular.ttf bungeeshade/BungeeShade-Regular.ttf monoton/Monoton-Regular.ttf sharetechmono/ShareTechMono-Regular.ttf chakrapetch/ChakraPetch-Regular.ttf chakrapetch/ChakraPetch-Medium.ttf chakrapetch/ChakraPetch-SemiBold.ttf chakrapetch/ChakraPetch-Bold.ttf; do
            curl -fsSL "$B/$f" -o "$D/$(basename $f)" || echo "police manquante $f"
          done
          ls -la $D
      - name: Liste anti-pub (StevenBlack hosts)
        run: |
          mkdir -p app/src/main/assets/adblock
          curl -fsSL https://raw.githubusercontent.com/StevenBlack/hosts/master/hosts -o app/src/main/assets/adblock/hosts.txt || echo "# liste indisponible" > app/src/main/assets/adblock/hosts.txt
          wc -l app/src/main/assets/adblock/hosts.txt
      - name: Dictionnaires PupKeyboard (FrequencyWords)
        run: |
          mkdir -p app/src/main/assets/kbd
          for L in fr en; do
            curl -fsSL "https://raw.githubusercontent.com/hermitdave/FrequencyWords/master/content/2018/$L/${L}_50k.txt" -o /tmp/$L.txt || : > /tmp/$L.txt
            grep -E "^[[:alpha:]'àâäçéèêëîïôöùûüÿœæÀÂÄÇÉÈÊËÎÏÔÖÙÛÜŸŒÆ-]+ [0-9]+$" /tmp/$L.txt | head -n 30000 > app/src/main/assets/kbd/$L.txt || true
            wc -l app/src/main/assets/kbd/$L.txt
          done
      - name: Construire
        env:
          VERSION_CODE: ${{ github.run_number }}
        run: |
          set -o pipefail
          gradle --no-daemon :app:assembleRelease :pupupdate:assembleRelease 2>&1 | tee build.log || { grep -E "error:|e: |\.java:[0-9]+: |What went wrong|Exception" build.log | head -40 | while IFS= read -r l; do echo "::error::$l"; done; exit 1; }
      - name: Renommer
        run: |
          cp app/build/outputs/apk/release/app-release.apk PuppyPhone.apk
          UPDV=$(grep -oP 'def UPD_VERSION = \K[0-9]+' pupupdate/build.gradle)
          cp pupupdate/build/outputs/apk/release/pupupdate-release.apk "PupUpdate-v$UPDV.apk"
          echo "UPD_APK=PupUpdate-v$UPDV.apk" >> $GITHUB_ENV
          ls -la *.apk
      - uses: actions/upload-artifact@v4
        with:
          name: PuppyPhone-apk
          path: |
            PuppyPhone.apk
            PupUpdate-v*.apk
      - name: Notes de version (nouveautés)
        env:
          MSG: ${{ github.event.head_commit.message }}
        run: |
          printf '%s\n' "$MSG" | grep -v -E '^(Co-Authored-By|Claude-Session):' | sed -e :a -e '/^\n*$/{$d;N;ba' -e '}' > notes.md
          printf '\n---\nTélécharge **PuppyPhone.apk** ci-dessous, ou mieux : installe **%s** (l’appli PupUpdate séparée) qui met PuppyPhone à jour et te ramène sur l’accueil 🦴.\n' "$UPD_APK" >> notes.md
          cat notes.md
      - name: Publier la version
        uses: softprops/action-gh-release@v2
        with:
          tag_name: puppyphone-v${{ github.run_number }}
          name: PuppyPhone v1.0.${{ github.run_number }} 🐾📱
          body_path: notes.md
          files: |
            PuppyPhone.apk
            ${{ env.UPD_APK }}
          make_latest: true
