name: Construire l'APK PupDown
on:
  push:
    branches: [ pupdown ]
  workflow_dispatch:
permissions:
  contents: write
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.7'
      - name: Construire
        env:
          VERSION_CODE: ${{ github.run_number }}
        run: gradle --no-daemon :app:assembleRelease
      - name: Renommer
        run: cp app/build/outputs/apk/release/app-release.apk PupDown.apk
      - uses: actions/upload-artifact@v4
        with:
          name: PupDown-apk
          path: PupDown.apk
      - name: Publier la version
        uses: softprops/action-gh-release@v2
        with:
          tag_name: pupdown-v${{ github.run_number }}
          name: PupDown v1.0.${{ github.run_number }} 🐶
          body: "Télécharge **PupDown.apk** ci-dessous, ouvre-le sur ton téléphone et autorise l'installation. 🐾"
          files: PupDown.apk
          make_latest: false
