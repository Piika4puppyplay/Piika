<!doctype html>
<html lang="fr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no,viewport-fit=cover">
<title>PuppyInternet</title>
<link rel="stylesheet" href="style.css">
<link rel="stylesheet" href="net.css">
</head>
<body class="net wall-neon">
<div id="ov" hidden>
  <div class="bg" aria-hidden="true"><i class="beam b1"></i><i class="beam b2"></i><div class="pawfloor"></div><div class="grain"></div></div>
  <div id="ovin"></div>
</div>
<div id="bar">
  <div id="prog"><i id="progi"></i></div>
  <div class="barrow" id="barrow">
    <button id="bhome" class="nb orbmini" type="button" aria-label="Accueil Puppy"></button>
    <div class="addr" id="addr">
      <button id="shield" class="shield" type="button" aria-label="Bloqueur"><span class="si" id="shi"></span><b id="bc">0</b></button>
      <button id="hostbtn" class="host" type="button"><span class="lk" id="lk"></span><span id="htxt">PuppyInternet</span></button>
      <button id="rel" class="rel" type="button" aria-label="Actualiser"></button>
    </div>
    <button id="btabs" class="tabsbtn" type="button" aria-label="Onglets"><b id="tc">1</b></button>
    <button id="bmenu" class="nb menub" type="button" aria-label="Menu"></button>
  </div>
  <div class="notice" id="notice" hidden></div>
</div>
<script src="icons.js"></script>
<script src="net.js"></script>
</body>
</html>
