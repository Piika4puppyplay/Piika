var REG=[[_t("1. Honnêteté"),_t("L'appli n'a que ta parole. Déclare ce qui s'est réellement passé : tu ne triches que contre toi.")],[_t("2. Départ"),_t("Le chrono démarre quand tu appuies sur « Démarrer ». Tu ne peux pas déclarer une date de départ ni une dernière fois antérieure.")],[_t("3. Pointage"),_t("Chaque jour, tu pointes avant 23h. Le jour du départ est exempté. Un pointage manqué remet le chrono à zéro.")],[_t("4. Volontaire ou non"),_t("Si tu l'as choisi, cherché ou continué, c'est volontaire : défi raté, le chrono repart à zéro même si tu l'as déclaré. Ce qui arrive sans que tu le choisisses (pollution nocturne, télé chez des amis, contenu vu par accident) ne change rien.")],[_t("5. Suspension"),_t("Tu peux suspendre un défi une seule fois, jusqu'à ta prochaine remise à zéro (le bouton est grisé ensuite). La suspension dure 48 h au maximum : au-delà, le chrono est remis à zéro. Pendant la pause, le chrono est figé et aucun pointage n'est demandé. À la reprise, tu déclares ce qui s'est passé.")],[_t("6. Fin de défi"),_t("« Mettre fin » arrête le défi pour de bon, sans culpabilité. Ton record, tes badges et tes cartes sont conservés et tu peux recommencer quand tu veux.")],[_t("7. Rechute"),_t("Un retour à zéro est un nouveau départ, sans culpabilité. Ton record, tes badges et tes cartes sont conservés.")],[_t("8. Horloge protégée"),_t("L'appli garde sa propre heure, qui ne peut pas reculer. Si l'heure du téléphone est en retard ou avant le 1 octobre 2026, l'appli se verrouille. Chaque déclaration affiche la date et l'heure à la seconde près.")],[_t("9. Sauvegarde"),_t("Enregistre régulièrement ton fichier de sauvegarde pour ne rien perdre si tu changes de téléphone.")],[_t("10. Mini-jeux"),_t("Les jeux sont réservés aux adultes, comme l'appli. Échecs : un problème de mat en 1, 2 ou 3 coups. Trouver le mat forcé fait gagner une carte ; un mauvais coup (ou un abandon) fait perdre la manche, avec un message d'encouragement et sans carte. Maths et français : 5 questions de niveau lycée à début d'études supérieures, il faut 4 bonnes réponses. Memory : retrouver les 8 paires en 20 coups maximum. Tu peux jouer autant que tu veux, mais tu ne gagnes qu'une seule carte par jour et par jeu. Les jeux ne changent jamais tes chronos.")],[_t("11. Mode SOS"),_t("Le bouton SOS lance un jeu plus long : un Memory de 15 paires, une série de 3 problèmes d'échecs (3 erreurs permises), un 2048 (carte dès la tuile 256) ou un Simon, tiré au hasard parmi les jeux que tu as activés (Memory de 15 paires, échecs, 2048, Simon, Sudoku 6×6, Taquin 4×4, 5 minutes de respiration, un mot mystère long, un Lights Out 4×4 une tour de Hanoï à 5 disques, une partie de morpion 4×4 ou un moment de Pop-it d'au moins 1 min 30). Le temps passé en mode SOS est compté pour toi, uniquement quand tu joues, et reste sur ton téléphone. Gagner donne une carte plus rare, mais une seule récompense SOS toutes les 48 heures. Entre-temps, tu peux rejouer à volonté sans récompense. Le SOS est un coup de pouce, pas un soin : en cas de grande détresse, parle à un proche ou à un professionnel.")],[_t("13. Tabac, drogues, alcool"),_t("Ces défis suivent la même logique que les autres : ce que tu choisis volontairement remet le chrono à zéro ; ce qui arrive sans que tu l'aies choisi (fumée des autres, substance donnée à ton insu), un médicament pris selon ton ordonnance, un substitut nicotinique ou un traitement de substitution ne change rien. Une grosse envie à laquelle tu résistes se déclare et se célèbre. Un retour à zéro est un nouveau départ, sans culpabilité. Piika ne remplace ni un médecin, ni Tabac Info Service, Drogues Info Service ou Alcool Info Service.")],[_t("18. Jeu 2048"),_t("Glisse les tuiles pour les fusionner. En partie normale, la carte du jour se débloque dès la tuile 128 ; en mode SOS, dès la tuile 256 (une récompense SOS toutes les 48 h). Une petite bulle l'annonce, puis tu continues à jouer jusqu'à la fin de la partie. Tu as 3 annulations par partie. Perdre à 2048 n'est jamais une fatalité.")],[_t("17. Bouton Aide"),_t("Un bouton « 🆘 Aide » reste visible sur tous les écrans, même si l'appli est verrouillée. En un clic, il donne les numéros d'aide selon la situation et les textes de loi qui protègent les victimes. Appeler est gratuit et souvent anonyme. Piika n'est pas un service d'urgence : en cas de danger, appelle le 17, le 112 ou le 15.")],[_t("15. Chemsex"),_t("Même esprit : ce que tu choisis (un produit pris dans un contexte sexuel) remet le chrono à zéro ; un refus, un rapport sans produit, un médicament prescrit ou un produit donné à ton insu ne change rien. Se faire dépister se déclare et se célèbre. La prévention et la réduction des risques passent avant tout, sans jugement.")],[_t("16. Prévention et dépistage"),_t("Piika te rappelle de te dépister régulièrement et rappelle que le secret médical est protégé par la loi. Piika ne remplace ni un médecin, ni Sida Info Service, ni un centre de dépistage.")],[_t("14. Mes défis (Réglages)"),_t("Dans Réglages, tu choisis les défis qui te concernent. Désactiver un défi met fin à son chrono en cours et le masque, avec ses succès. Son record, ses badges et tes cartes sont conservés. Tu peux le réactiver à tout moment, sans jugement.")],[_t("19. Simon"),_t("Répète une séquence de couleurs qui s'allonge d'une étape à chaque tour. Ton objectif pour la carte du jour est adaptatif : il part de 5 et se règle sur la moyenne de tes dernières parties (un peu plus ou un peu moins, au hasard, jamais impossible). Il n'existe pas de moyenne officielle au Simon ; la science de la mémoire de travail situe notre capacité autour de 4 à 7 éléments, donc 5 étapes, c'est dans la moyenne. Tu peux jouer jusqu'à ta première erreur, la carte est donnée dès l'objectif atteint.")],[_t("20. Mes jeux (Réglages)"),_t("Tu peux activer ou désactiver chaque jeu. Un jeu désactivé n'apparaît plus dans l'onglet Jeux ni dans le mode SOS, et ses succès sont masqués sans être supprimés. Réactive-le à tout moment pour les retrouver.")],[_t("21. Joker 🃏"),_t("Un joker te protège d'un oubli. Tu en reçois un dès ta première ouverture de Piika. Si un pointage est manqué (ou si tu restaures une vieille sauvegarde et que des jours sont passés), Piika te propose : utiliser ton joker, et tes chronos continuent exactement là où l'oubli a eu lieu ; ou le garder, et les chronos concernés repartent de zéro. Utiliser le joker le rend indisponible pendant 30 jours, sans exception. Quand ces 30 jours sont passés, un nouveau joker te revient tout seul. Les jokers ne s'accumulent pas : il n'y en a jamais plus d'un. Un joker couvre d'un coup tous tes défis concernés. Il ne change rien d'autre : les pointages du jour restent à faire.")],[_t("22. Sudoku"),_t("Remplis la grille pour que chaque ligne, chaque colonne et chaque bloc contienne tous les chiffres une seule fois. Trois tailles : 4×4 (facile), 6×6 et 9×9. Les chiffres en rouge se répètent, et quelques indices (2 en 4×4, 3 ensuite) remplissent une case pour toi. Terminer une grille donne ta carte du jour pour ce jeu ; abandonner n'a aucune conséquence.")],[_t("23. Taquin"),_t("Fais glisser les tuiles pour les ranger de 1 à 8 (3×3) ou de 1 à 15 (4×4), la case vide en bas à droite. Touche une tuile alignée avec la case vide. Résoudre le taquin donne ta carte du jour ; tu peux relancer un nouveau mélange quand tu veux.")],[_t("24. Respiration guidée"),_t("Un cercle qui grandit et rétrécit t'aide à respirer calmement : 5 secondes pour inspirer, 5 secondes pour expirer, pendant 2 ou 5 minutes. Aller jusqu'au bout donne ta carte du jour pour ce jeu. Ce n'est pas un soin : en cas de malaise, respire normalement et arrête ; en détresse, utilise le bouton 🆘 Aide. Si tu t'arrêtes avant la fin, rien n'est perdu et aucun jeu n'est compté comme perdu.")],[_t("25. Mot mystère"),_t("Une définition t'est donnée : devine le mot en choisissant des lettres. Tu as 7 vies, une mauvaise lettre en coûte une, et 2 indices révèlent une lettre sans rien te coûter. Deux niveaux : mots courts et mots longs. Trouver le mot donne ta carte du jour pour ce jeu. Si tu perds ou abandonnes, le mot et sa définition te sont montrés, sans jugement.")],[_t("26. Lights Out"),_t("Éteins toutes les lumières d'une grille 3×3, 4×4 ou 5×5. Toucher une case change son état et celui de ses quatre voisines. Chaque grille a toujours une solution, et 3 indices t'entourent une case utile. Réussir donne ta carte du jour pour ce jeu.")],[_t("27. Tours de Hanoï"),_t("Déplace la pile de 3, 4 ou 5 disques de la tige de gauche vers celle de droite, un disque à la fois, sans jamais poser un grand disque sur un plus petit. Touche une tige, puis la tige d'arrivée. Tu peux annuler un coup. Le nombre minimum de coups est affiché (7, 15 ou 31). Réussir donne ta carte du jour pour ce jeu.")],[_t("28. Morpion"),_t("Tu joues les croix et tu commences, en 3×3 ou en 4×4 (il faut alors aligner 4 signes). L'IA est volontairement tolérante : elle se trompe parfois, pour que tu puisses gagner. Un match nul n'est ni une victoire ni une défaite : le plateau est effacé et tu rejoues. Gagner donne ta carte du jour pour ce jeu.")],[_t("29. Pop-it"),_t("Un jeu apaisant pour occuper les mains pendant une envie : éclate les bulles, sans score, sans limite et sans carte du jour. Tu peux couper le son et la vibration. En mode SOS, après 1 min 30, le bouton « Je me sens mieux » donne ta récompense SOS.")],[_t("30. Mon chemin"),_t("Dans l'onglet Succès, la page « Mon chemin » montre les jours cumulés, tes records et une barre par jour sur les 30 derniers jours. Une journée compte quand le chrono tourne au moins la moitié de la journée. Les chronos remis à zéro ou arrêtés sont archivés à partir de la version 1.12 (les plus anciens ne sont pas connus). Ces données restent sur ton téléphone et sont incluses dans ton fichier de sauvegarde. Rien n'est jamais retiré de ce que tu as accompli : un retour à zéro n'efface pas ton chemin.")],[_t("12. Succès des jeux"),_t("Des succès propres aux jeux se débloquent selon tes victoires. Ils sont affichés dans l'onglet Jeux et dans l'onglet Succès. Ils n'ont aucun effet sur tes défis.")]];

var FAQ=[[_t("Pourquoi 150 cartes ?"),_t("Les 150 cartes sont un hommage direct au prénom du créateur, Piika, et à une collection de monstres de poche d'un jeu vidéo culte des années 90/2000. Elles s'inspirent des classiques du jeu vidéo et du jeu des 7 familles : Héros, Mages, Bêtes, Lieux, Trésors, Monstres et Joueurs.")],[_t("Comment gagner des cartes ?"),_t("Chaque pointage réussi (sans remise à zéro) offre une carte par défi et par jour. Chaque palier de badge (1, 3, 7, 14, 30, 60, 90 et 180 jours) offre en plus une carte bonus, de plus en plus rare. Les cartes communes, rares, épiques et légendaires sont tirées au hasard.")],[_t("Pourquoi « Piika » ?"),_t("C'est le prénom du créateur. L'appli porte son nom, comme une signature.")],[_t("Est-ce vraiment gratuit ? Où est le piège ?"),_t("Il n'y en a pas. Pas d'abonnement, pas de version premium, pas de publicité, pas de compte. Le code est libre (GPLv3) et tout tourne sur ton téléphone : l'appli ne coûte rien à faire vivre.")],[_t("Comment installer Piika sur mon téléphone ?"),_t("Ouvre la page dans ton navigateur, puis utilise « Ajouter à l'écran d'accueil » ou « Installer l'application » dans le menu. Ensuite elle fonctionne sans connexion.")],[_t("Comment fonctionnent les mises à jour ? Est-ce sûr ?"),_t("Rien ne se met à jour sans toi. À l'ouverture, si tu es en ligne, ton navigateur regarde sur le site de Piika si un petit fichier public (celui qui contient le numéro de version) a changé. C'est tout : aucune donnée sur toi n'est envoyée, il n'y a ni compte ni suivi. Le navigateur n'accepte que des fichiers venant du site de Piika, en connexion sécurisée (HTTPS). S'il y a du nouveau, une fenêtre te propose « Mettre à jour » (environ une seconde), « Plus tard » ou « Ignorer cette mise à jour ». Tes chronos, cartes et réglages restent sur ton téléphone et ne sont pas touchés. Sans connexion, rien ne se passe : Piika marche comme d'habitude. Le code de chaque version est libre et public sur GitHub, donc chacun peut lire ce qui change.")],[_t("Une IA a-t-elle tout écrit ?"),_t("Claude, une IA d'Anthropic, a écrit le code et les textes en collaboration totale avec Piika, qui a eu l'idée, décidé des règles et testé l'appli. C'est un travail à deux.")],[_t("Où est le code source ?"),_t("Le code est libre (GNU GPLv3) et publié sur GitHub. Tu peux l'étudier, le modifier et le partager.")],[_t("Pourquoi l'appli se verrouille ?"),_t("Parce que l'heure du téléphone est revenue en arrière ou est invalide. Pour que les chronos restent justes, l'appli garde sa propre heure et refuse de reculer. Remets l'heure automatique : le déblocage est automatique quand l'heure rattrape la dernière heure connue.")],[_t("Mon fichier de sauvegarde est-il protégé ?"),_t("Oui : il est chiffré et signé. Seule cette appli peut le lire, et toute modification le rend invalide. Une sauvegarde plus ancienne que les données du téléphone est refusée, et les jours sans pointage depuis l'export remettent les chronos à zéro. Exporte donc juste avant de changer de téléphone.")],[_t("À quoi sert « Suspendre » ?"),_t("À figer le chrono sans le remettre à zéro (maladie, voyage, raison médicale). Une seule fois par défi, 48 h maximum, jusqu'à ta prochaine remise à zéro. À la reprise, tu déclares ce qui s'est passé pendant la pause.")],[_t("Quelle différence avec « Mettre fin » ?"),_t("« Suspendre » met le défi en pause pour le reprendre. « Mettre fin » arrête le défi pour de bon : tu gardes ton record et tes badges, et tu recommences quand tu veux.")],[_t("Pourquoi une seule suspension ?"),_t("Pour éviter de contourner les règles : sans limite, on pourrait suspendre avant chaque rechute. Elle se débloque après une remise à zéro.")],[_t("Pourquoi c'est gratuit ?"),_t("L'appli est pensée comme un outil d'aide : pas de compte, pas de pub, pas d'abonnement. Tout est stocké sur ton téléphone, donc il n'y a rien à payer.")],[_t("Pourquoi on ne peut pas déclarer sa dernière fois ?"),_t("Pour éviter les fausses déclarations. Si on pouvait antidater un départ, on pourrait tricher et se mentir à soi-même, et les records et badges n'auraient plus de valeur. Seuls comptent les jours que tu as vraiment pointés ici.")],[_t("Pourquoi le pointage avant 23h est obligatoire ?"),_t("Il t'oblige à faire le point chaque jour et à rester honnête. Pense à mettre une alarme à 22h.")],[_t("Pourquoi une rechute déclarée remet quand même le chrono à zéro ?"),_t("Déclarer honnêtement est une bonne chose, mais le défi est raté quand c'est volontaire. Ton record et tes badges restent.")],[_t("Qui décide si c'est volontaire ?"),_t("Toi. Règle simple : si tu l'as choisi, cherché ou continué, c'est volontaire.")],[_t("Mes données sont-elles privées ?"),_t("Oui. Elles restent sur ton téléphone. Seul le fichier de sauvegarde, que tu enregistres toi-même, en sort.")],[_t("Pourquoi des questions de niveau scolaire dès 16 ans, dans une appli réservée aux adultes ?"),_t("Parce que beaucoup de jeunes et d'adultes ont décroché ou pris du retard à l'école, le créateur y compris. Les questions de maths et de français vont du niveau lycée au début des études supérieures (16 à 25 ans) : une façon de se remettre à niveau en douceur, sans jugement et sans note. L'appli reste réservée aux adultes ; seul le niveau des questions est celui-là.")],[_t("Combien de cartes puis-je gagner avec les jeux ?"),_t("Une carte par jour et par jeu (échecs, maths, français, Memory), et une récompense SOS toutes les 48 heures. Tu peux jouer sans limite, mais une victoire de plus le même jour ne donne pas de carte supplémentaire.")],[_t("Y a-t-il roque et prise en passant aux échecs ?"),_t("Non. Les problèmes sont des positions simples où le mat forcé existe avec les déplacements habituels, sans roque ni prise en passant. Un pion qui arrive au bout devient une dame.")],[_t("Pourquoi des défis tabac, drogues et alcool ?"),_t("Piika a d'abord créé l'appli pour arrêter de se masturber, puis a voulu qu'elle serve à presque tout le monde, même s'il n'a lui-même jamais fumé une cigarette ni un joint. Chacun garde les défis qui le concernent, dans Réglages.")],[_t("J'ai respiré la fumée de mon voisin ou allumé sa cigarette : ai-je perdu ?"),_t("Non. Ce qui n'est pas ton choix de consommer ne change rien : fumée des autres, cigarette allumée pour quelqu'un sans fumer, substance donnée à ton insu. Une envie résistée se déclare comme une victoire.")],[_t("Les substituts et les médicaments comptent-ils ?"),_t("Non. Patch, gomme, pastille nicotinique, médicament prescrit et traitement de substitution font partie de ta santé et ne remettent rien à zéro.")],[_t("Puis-je masquer un défi qui ne me concerne pas ?"),_t("Oui, dans l'onglet Réglages. Tu peux le réactiver quand tu veux, sans jugement : ton record, tes badges et tes cartes sont conservés.")],[_t("Piika remplace-t-elle un médecin ou une aide officielle ?"),_t("Non. Piika est un outil de motivation. Pour arrêter le tabac, les drogues ou l'alcool, appelle Tabac Info Service (39 89), Drogues Info Service (0 800 23 13 13) ou Alcool Info Service (0 980 980 930), ou parle à un médecin. Arrêter brutalement l'alcool ou certaines drogues peut être dangereux.")],[_t("Qu'est-ce que le chemsex ?"),_t("Le chemsex consiste à prendre des produits (GHB/GBL, cathinones, cocaïne, kétamine, crystal…) pour avoir des rapports sexuels, souvent longs. Il peut être source de plaisir comme de dépendance, de pertes de contrôle ou de prises de risque. Ce défi t'aide à reprendre la main, sans jugement, et rappelle les gestes de prévention.")],[_t("Mon dépistage est-il vraiment secret ?"),_t("Oui. Médecins, laboratoires, pharmaciens et centres de dépistage sont tenus au secret : article 226-13 du Code pénal, « La révélation d'une information à caractère secret par une personne qui en est dépositaire soit par état ou par profession, soit en raison d'une fonction ou d'une mission temporaire, est punie d'un an d'emprisonnement et de 15 000 euros d'amende. » Et l'article L1110-4 du Code de la santé publique garantit à toute personne prise en charge « le respect de sa vie privée et du secret des informations la concernant ». En CeGIDD, tu peux aussi te dépister gratuitement et sous anonymat.")],[_t("Pourquoi me dépister si je n'ai aucun symptôme ?"),_t("Parce que beaucoup d'IST (chlamydia, gonocoque, syphilis, VIH, hépatites) ne donnent aucun symptôme pendant longtemps, mais se transmettent. Détectées tôt, la plupart se soignent bien, et le VIH se traite : avec un traitement efficace, la charge virale devient indétectable et le virus ne se transmet plus sexuellement.")],[_t("J'ai pris un risque hier : que faire ?"),_t("Si c'était un rapport avec un risque de VIH, va aux urgences le plus vite possible : le traitement post-exposition (TPE) est le plus efficace dans les 4 premières heures et possible jusqu'à 48 heures. Appelle aussi Sida Info Service (0 800 840 800). Aucun jugement : la seule bonne décision, c'est d'agir.")],[_t("À quoi sert le bouton « Aide » ?"),_t("Il ouvre une page avec les numéros d'aide classés par situation : danger, détresse (3114), insultes ou menaces homophobes, personne trans en danger, drogue à ton insu, sexe sans consentement, violences dans le couple, agression, cyberharcèlement. Chaque situation explique quoi faire, comment en parler de façon anonyme et comment porter plainte. Les textes de loi sont en bas de la page.")],[_t("Comment marche le 2048 ?"),_t("Glisse ton doigt (ou utilise les flèches) pour faire fusionner deux tuiles identiques. La carte du jour est débloquée à la tuile 128 (256 en mode SOS), annoncée par une bulle discrète, et tu continues à jouer. Tu as 3 annulations. À la fin, tu reçois un message d'encouragement et un conseil pour aller plus loin.")],[_t("Que mesure le temps passé en mode SOS ?"),_t("Le temps de jeu réellement actif pendant les parties lancées par le bouton SOS (les pauses de plus de 2 minutes ne comptent pas). Il reste sur ton téléphone, ne sert qu'à t'encourager et n'est jamais envoyé.")],[_t("Je n'ai fait que 5 au Simon, c'est nul ?"),_t("Pas du tout. La mémoire de travail humaine retient en moyenne 4 à 7 éléments à la fois : 5 étapes, c'est dans la moyenne. Les scores plus élevés viennent surtout de méthodes (regrouper par blocs, se raconter une histoire) et d'entraînement.")],[_t("Comment récupérer un joker ?"),_t("Tu as un joker dès ta première ouverture. Après l'avoir utilisé, il revient tout seul 30 jours plus tard. Tu ne peux pas en avoir plusieurs en même temps.")],[_t("Et si un nettoyeur vide les données de Chrome ?"),_t("Un vidage du cache seul ne touche pas à Piika. Mais « effacer les données du site » ou les données de Chrome supprime ta progression. Piika demande au navigateur de protéger son stockage, sans garantie. Enregistre un fichier de sauvegarde de temps en temps : cartes, succès et réglages seront restaurés ; les chronos repartent de zéro si la sauvegarde est ancienne, sauf si tu utilises ton joker 🃏.")],[_t("Et si je change de téléphone ?"),_t("Enregistre ton fichier de sauvegarde dans l'onglet Sauvegarde, puis restaure-le sur le nouveau téléphone.")]];
var HEALTH=[[_t("Ta santé d'abord"),_t("Ne saute pas de repas, de sommeil ni de soins pour un chrono. Un défi se reprend, ta santé non.")],[_t("Sommeil"),_t("Vise 7 à 9 heures par nuit, à heures régulières. Bien dormir aide à mieux résister aux envies.")],[_t("Eau et alimentation"),_t("Bois régulièrement et mange équilibré. Évite de compenser les envies par trop de sucre ou d'alcool.")],[_t("Bouger"),_t("30 minutes d'activité par jour suffisent. Échauffe-toi, progresse doucement et repose-toi si tu as mal.")],[_t("Écrans et yeux"),_t("Toutes les 20 minutes, regarde au loin pendant 20 secondes. Évite les écrans dans l'heure qui précède le coucher.")],[_t("Cage : hygiène"),_t("Lave la cage et ta peau chaque jour, sèche bien, et choisis une taille et une matière adaptées. Une peau irritée ou humide s'infecte plus facilement.")],[_t("Cage : signaux d'alerte"),_t("Douleur, gonflement, rougeur, plaie, changement de couleur ou engourdissement : retire la cage et consulte. Il n'existe pas de durée sûre pour tout le monde : demande conseil à un médecin.")],[_t("Cage : raison médicale"),_t("Si tu dois la retirer pour ta santé, utilise « Suspendre » (une fois, 48 h maximum) : le chrono s'arrête sans se remettre à zéro. Si c'est plus long, mets fin au défi : ta santé passe avant.")],[_t("Moral"),_t("Frustration, irritabilité ou tristesse qui durent ? Parles-en à un proche ou à un médecin. Le défi ne doit pas t'isoler.")],[_t("Idées noires"),_t("Si tu as des idées noires, ne reste pas seul : appelle le 3114 (France, gratuit, 24h/24) ou les urgences.")],[_t("Rapports sexuels"),_t("Utilise un préservatif et fais-toi dépister régulièrement, surtout si tu as plusieurs partenaires.")],[_t("Consulter"),_t("Une douleur, une gêne ou une inquiétude qui dure : un médecin est là pour t'aider, sans jugement.")]];
HEALTH.push([_t("Tabac : précautions"),_t("Arrêter peut donner irritabilité, troubles du sommeil, toux ou faim passagères : ton corps se réadapte. Si tu prends des médicaments (traitement psychiatrique, asthme…), préviens ton médecin : les doses peuvent changer quand on arrête de fumer. Piika ne remplace ni ton médecin ni Tabac Info Service (39 89)."),"tabac"],[_t("Drogues : précautions"),_t("N'arrête pas brutalement certains produits sans avis médical (opiacés, benzodiazépines) : le sevrage peut être dangereux. Pendant l'arrêt, ta tolérance baisse : en cas de rechute, ta dose habituelle peut devenir dangereuse. Ne mélange pas les produits. Malaise ou surdose : appelle le 15 ou le 112. Piika ne remplace ni un médecin ni Drogues Info Service (0 800 23 13 13)."),"drogue"],[_t("Alcool : précautions"),_t("Si tu bois beaucoup et chaque jour, ne t'arrête pas seul et d'un coup : le sevrage peut provoquer tremblements, sueurs, confusion, convulsions. Consulte un médecin, qui pourra t'accompagner. Piika ne remplace pas Alcool Info Service (0 980 980 930)."),"alcool"],[_t("Sans culpabilité"),_t("Une rechute n'efface ni ton travail, ni ton record, ni ce que ton corps a déjà récupéré. Repars dès que tu peux, avec l'aide de quelqu'un si tu en as besoin.")],[_t("Pratiques sexuelles à risques (sans jugement)"),_t("Le risque dépend surtout de : rapports sans préservatif (anal, vaginal, parfois oral), partenaires multiples, partage de matériel (seringues, pailles, jouets non nettoyés ou non protégés), sexe sous produits qui baissent la vigilance, et pratiques qui blessent ou font saigner. On peut les rendre plus sûres : préservatif et gel adaptés, un préservatif neuf par partenaire et par pratique, jouets nettoyés ou protégés, matériel personnel jamais partagé, pauses pour boire et se reposer. Pour toute question sur le sexe et la réduction des risques : Sida Info Service, 0 800 840 800 (gratuit, anonyme)."),"chemsex"],[_t("PrEP, TPE et vaccins"),_t("La PrEP est un traitement préventif contre le VIH, prescrit par tout médecin et remboursé. Après un risque, le TPE se prend aux urgences au plus vite (idéalement dans les 4 heures, au plus tard 48 heures). Des vaccins existent contre les hépatites A et B et les papillomavirus (HPV). Le préservatif réduit le risque de la plupart des IST, sans protéger de tout (herpès, syphilis, HPV selon les zones touchées)."),"chemsex"],[_t("Chemsex : réduire les risques"),_t("Mélanger des produits est le plus dangereux, surtout le GHB/GBL avec l'alcool ou d'autres sédatifs (coma). Les poppers avec les médicaments de l'érection peuvent faire chuter la tension. Ne reste pas seul, prévois de l'eau, des repas et des pauses, et préviens un proche de confiance. Si quelqu'un ne répond plus ou respire mal : appelle le 15 ou le 112 et mets-le sur le côté. Si tu t'injectes, utilise du matériel neuf, jamais partagé : pharmacies et CAARUD en donnent gratuitement. Si tu penses qu'on t'a drogué à ton insu : va aux urgences, tu peux porter plainte, ce n'est pas ta faute."),"chemsex"],[_t("Chemsex : après la session"),_t("La descente (fatigue, tristesse, anxiété) est fréquente et passe. Dors, mange, bois de l'eau et parle à quelqu'un. Si tu te sens très mal, appelle le 3114. Consulter un CSAPA ou Drogues Info Service est gratuit et sans jugement."),"chemsex"],[_t("Secret médical"),_t("Médecins, infirmiers, pharmaciens, laboratoires et centres de dépistage sont tenus au secret professionnel (article 226-13 du Code pénal : un an d'emprisonnement et 15 000 € d'amende en cas de révélation). Tu peux parler franchement de ta sexualité et de tes consommations : c'est protégé. En CeGIDD, le dépistage est gratuit et peut être anonyme.")]);

var TIPS=[[_t("Quand l'envie monte"),_t("Applique la règle des 10 minutes : bouge, bois un verre d'eau, sors prendre l'air. L'envie passe en vagues.")],[_t("Change de lieu"),_t("Quitte la chambre ou la salle de bain. Reste dans les pièces communes quand tu es fatigué.")],[_t("Évite les déclencheurs"),_t("Repère l'heure, le lieu ou l'émotion qui précède l'envie (ennui, stress, solitude) et prévois autre chose.")],[_t("Téléphone"),_t("Pas de téléphone au lit. Charge-le hors de la chambre et installe un bloqueur de contenu adulte.")],[_t("Sport"),_t("Pompes, marche rapide ou douche froide : dépense l'énergie physiquement.")],[_t("Sommeil"),_t("Couche-toi à heure fixe. La plupart des rechutes arrivent tard le soir.")],[_t("Pointage"),_t("Mets une alarme à 22h pour ne jamais rater ton pointage.")],[_t("Rechute"),_t("Une rechute n'efface pas tes progrès. Note ce qui l'a déclenchée, remets à zéro et repars.")],[_t("Parler"),_t("Parle à une personne de confiance. Si le besoin devient envahissant, un professionnel peut aider.")],[_t("Récompenses"),_t("Fixe-toi un plaisir concret à chaque palier : sortie, repas, achat utile.")]];
TIPS.push([_t("Tabac : repère tes déclencheurs"),_t("Café, pause, alcool, téléphone, stress : note les moments où tu fumais et prépare une autre action pour chacun (marcher, boire de l'eau, respirer)."),"tabac"],[_t("Tabac : la règle des 5 minutes"),_t("Une envie dure en général quelques minutes. Respire profondément, bois de l'eau, occupe tes mains, puis attends : elle redescend."),"tabac"],[_t("Tabac : les substituts aident"),_t("Patchs, gommes et pastilles augmentent nettement les chances d'arrêter. Un pharmacien, un médecin ou Tabac Info Service (39 89) peut t'aider à choisir la dose."),"tabac"],[_t("Tabac : l'argent économisé"),_t("Renseigne ce que tu dépensais par jour dans les réglages du défi : voir la somme grandir motive."),"tabac"],[_t("Drogues : change de décor"),_t("Éloigne-toi des lieux, des contacts et des applis liés à la consommation, et dis à une personne de confiance que tu arrêtes."),"drogue"],[_t("Drogues : prépare ton plan"),_t("Écris à l'avance trois actions pour les envies (appeler quelqu'un, sortir, bouger) et une phrase pour refuser un produit. Tu n'auras pas à improviser."),"drogue"],[_t("Drogues : tu n'es pas seul"),_t("Drogues Info Service est gratuit et anonyme. Les consultations jeunes consommateurs et les CSAPA accompagnent sans jugement, souvent gratuitement."),"drogue"],[_t("Alcool : remplace le rituel"),_t("Si tu buvais à l'apéro ou devant un match, garde le rituel avec une boisson que tu aimes : eau pétillante, thé glacé, jus."),"alcool"],[_t("Alcool : prépare ta réponse"),_t("Aie une phrase prête : « Non merci, je prends autre chose. » Tu n'as pas à te justifier."),"alcool"],[_t("Alcool : évite les pièges"),_t("Ne garde pas d'alcool chez toi au début, évite les lieux où tu buvais et prévois un plan B (partir tôt) en soirée."),"alcool"],[_t("Alcool : les bénéfices arrivent"),_t("Sommeil, humeur et énergie s'améliorent souvent dès les premières semaines. Note ce que tu remarques."),"alcool"]);

["Code pénal, art. 222-22 : le consentement","« Constitue une agression sexuelle tout acte sexuel non consenti commis sur la personne d'autrui ou sur la personne de l'auteur ou, dans les cas prévus par la loi, commis sur un mineur par un majeur. Au sens de la présente section, le consentement est libre et éclairé, spécifique, préalable et révocable. Il est apprécié au regard des circonstances. Il ne peut être déduit du seul silence ou de la seule absence de réaction de la victime. Il n'y a pas de consentement si l'acte à caractère sexuel est commis avec violence, contrainte, menace ou surprise, quelle que soit leur nature. Le viol et les autres agressions sexuelles sont constitués lorsqu'ils ont été imposés à la victime dans les conditions prévues par la présente section, quelle que soit la nature des relations existant entre l'agresseur et sa victime, y compris s'ils sont unis par les liens du mariage. »","Un oui doit être libre, clair, donné avant, et tu peux le retirer à tout moment. Le silence n'est pas un oui. Même en couple, imposer un acte sexuel est puni."],
["Code pénal, art. 222-23 : le viol","« Tout acte de pénétration sexuelle, de quelque nature qu'il soit, ou tout acte bucco-génital ou bucco-anal commis sur la personne d'autrui ou sur la personne de l'auteur par violence, contrainte, menace ou surprise est un viol. Le viol est puni de quinze ans de réclusion criminelle. »","Cela concerne toutes les personnes, quels que soient leur sexe et leur orientation."],
["Code pénal, art. 222-24 (extrait) : viol aggravé","« Le viol défini à l'article 222-23 est puni de vingt ans de réclusion criminelle […] 15° Lorsqu'une substance a été administrée à la victime, à son insu, afin d'altérer son discernement ou le contrôle de ses actes »","Droguer quelqu'un pour abuser de lui fait passer la peine de 15 à 20 ans."],

["Code pénal, art. 222-15 : substances nuisibles","« L'administration de substances nuisibles ayant porté atteinte à l'intégrité physique ou psychique d'autrui est punie des peines mentionnées aux articles 222-7 à 222-14-1 suivant les distinctions prévues par ces articles. Les deux premiers alinéas de l'article 132-23 relatif à la période de sûreté sont applicables à cette infraction dans les mêmes cas que ceux prévus par ces articles. »","Donner une drogue ou un produit dangereux à quelqu'un est puni comme des violences, selon la gravité."],
["Code pénal, art. 222-13 (extrait) : violences","« Les violences ayant entraîné une incapacité de travail inférieure ou égale à huit jours ou n'ayant entraîné aucune incapacité de travail sont punies de trois ans d'emprisonnement et de 45 000 euros d'amende […] Par le conjoint ou le concubin de la victime ou le partenaire lié à la victime par un pacte civil de solidarité […] A raison du sexe, de l'orientation sexuelle ou de l'identité de genre vraie ou supposée de la victime »","Dans le couple ou à cause de l'orientation ou du genre, des violences même légères sont déjà un délit grave."],

["Code pénal, art. 222-33 (extrait) : harcèlement sexuel","« Le harcèlement sexuel est le fait d'imposer à une personne, de façon répétée, des propos ou comportements à connotation sexuelle ou sexiste […] Les faits mentionnés aux I et II sont punis de deux ans d'emprisonnement et de 30 000 € d'amende. »","Les propos ou gestes sexuels répétés et non voulus sont un délit."],
["Code pénal, art. 132-77 (extrait) : motif homophobe, biphobe ou transphobe","« Lorsqu'un crime ou un délit est précédé, accompagné ou suivi de propos, écrits, images, objets ou actes de toute nature qui soit portent atteinte à l'honneur ou à la considération de la victime ou d'un groupe de personnes dont fait partie la victime à raison de son sexe, son orientation sexuelle ou identité de genre vraie ou supposée, soit établissent que les faits ont été commis contre la victime pour l'une de ces raisons, le maximum de la peine privative de liberté encourue est relevé […] »","Si une agression vise ton orientation ou ton identité de genre, la peine maximale est relevée."],
["Code pénal, art. R625-8-1 : insulte non publique","« L'injure non publique commise envers une personne ou un groupe de personnes à raison de leur origine ou de leur appartenance ou de leur non-appartenance, vraie ou supposée, à une ethnie, une nation, une prétendue race ou une religion déterminée est punie de l'amende prévue pour les contraventions de la 5e classe. Est punie de la même peine l'injure non publique commise envers une personne ou un groupe de personnes à raison de leur sexe, de leur orientation sexuelle ou identité de genre, ou de leur handicap. »","Une insulte homophobe ou transphobe, même en privé, est punie d'une amende. En public, elle relève de la loi du 29 juillet 1881."],
["Code pénal, art. 223-6 : porter secours","« Quiconque pouvant empêcher par son action immédiate, sans risque pour lui ou pour les tiers, soit un crime, soit un délit contre l'intégrité corporelle de la personne s'abstient volontairement de le faire est puni de cinq ans d'emprisonnement et de 75 000 euros d'amende. Sera puni des mêmes peines quiconque s'abstient volontairement de porter à une personne en péril l'assistance que, sans risque pour lui ou pour les tiers, il pouvait lui prêter soit par son action personnelle, soit en provoquant un secours. »","Si tu es témoin, appeler les secours est un devoir (et tu ne dois pas te mettre en danger)."],
