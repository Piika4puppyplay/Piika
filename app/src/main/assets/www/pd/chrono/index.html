/* calendar picker */
const MONTHS = new Intl.DateTimeFormat("fr-FR",{month:"long",year:"numeric"});
function calendar(ms, futureOnly, onOk, onBack){
  let sel = new Date(ms); sel.setHours(0,0,0,0);
  let view = new Date(sel.getFullYear(), sel.getMonth(), 1);
  const today = new Date(today0());
  const draw = () => {
    const first = (view.getDay()+6)%7;
    const dim = new Date(view.getFullYear(), view.getMonth()+1, 0).getDate();
    let cells = ["L","M","M","J","V","S","D"].map(d=>`<div class="dow">${d}</div>`).join("");
    for(let k=0;k<first;k++) cells += `<div class="day out"></div>`;
    for(let d=1; d<=dim; d++){
      const dt = new Date(view.getFullYear(), view.getMonth(), d);
      const cls = ["day"]; if(+dt===+today) cls.push("today"); if(+dt===+sel) cls.push("sel");
      const dis = futureOnly ? dt < today : dt > today;
      cells += `<button class="${cls.join(" ")}" data-d="${+dt}" ${dis?"disabled":""}>${d}</button>`;
    }
    openSheet(`
      <h2>${futureOnly?"Choisis le jour J":"Début du décompte"}</h2>
      ${futureOnly?`<div class="chips">${[[1,"+1 mois"],[3,"+3 mois"],[6,"+6 mois"],[12,"+1 an"]].map(([n,l])=>`<button class="chip" data-add="${n}">${l}</button>`).join("")}</div>`:`<div class="chips"><button class="chip" data-today>Aujourd'hui</button></div>`}
      <div class="cal-head"><button class="nav" id="cPrev" aria-label="Mois précédent"><svg viewBox="0 0 24 24"><path d="M15 5l-7 7 7 7"/></svg></button><b>${MONTHS.format(view)}</b><button class="nav" id="cNext" aria-label="Mois suivant"><svg viewBox="0 0 24 24"><path d="M9 5l7 7-7 7"/></svg></button></div>
      <div class="cal">${cells}</div>
      <div class="sel-line">${fmtDate(+sel)}</div>
      <div class="actions"><button class="btn ghost" id="cBack">Retour</button><button class="btn main" id="cOk">Valider</button></div>
    `, sh => {
      sh.querySelector("#cPrev").onclick = () => { view = new Date(view.getFullYear(), view.getMonth()-1, 1); draw(); };
      sh.querySelector("#cNext").onclick = () => { view = new Date(view.getFullYear(), view.getMonth()+1, 1); draw(); };
      sh.querySelectorAll("[data-d]").forEach(b => b.onclick = () => { sel = new Date(+b.dataset.d); draw(); });
      sh.querySelectorAll("[data-add]").forEach(b => b.onclick = () => { const n=new Date(today); n.setMonth(n.getMonth()+ +b.dataset.add); sel=n; view=new Date(n.getFullYear(),n.getMonth(),1); draw(); });
      const tb = sh.querySelector("[data-today]"); if(tb) tb.onclick = () => { sel=new Date(today); view=new Date(today.getFullYear(),today.getMonth(),1); draw(); };
      sh.querySelector("#cBack").onclick = onBack;
      sh.querySelector("#cOk").onclick = () => onOk(+sel);
    });
  };
  draw();
}

/* clock picker (24h dial) */
function clockPicker(ms, onOk, onBack){
  const base = new Date(ms);
  let h = base.getHours(), m = base.getMinutes(), mode = "h";
  const C = 140, RO = 112, RI = 76;
  const pos = (a, r) => [C + r*Math.sin(a), C - r*Math.cos(a)];
  const draw = () => {
    let marks = "", hand;
    if(mode==="h"){
      for(let k=0;k<12;k++){
        const a = k*Math.PI/6;
        const outer = k===0?12:k, inner = k===0?0:k+12;
        const [x1,y1] = pos(a,RO), [x2,y2] = pos(a,RI);
        marks += `<text x="${x1}" y="${y1}" class="${h===outer?"on":""}">${outer}</text><text x="${x2}" y="${y2}" class="in ${h===inner?"on":""}">${pad(inner)}</text>`;
      }
      hand = pos((h%12)*Math.PI/6, (h===0||h>12)?RI:RO);
    } else {
      for(let k=0;k<12;k++){ const [x,y] = pos(k*Math.PI/6, RO); marks += `<text x="${x}" y="${y}" class="${m===k*5?"on":""}">${pad(k*5)}</text>`; }
      hand = pos(m*Math.PI/30, RO);
    }
    openSheet(`
      <h2>Heure du jour J</h2>
      <div class="tdisp"><button id="kH" aria-pressed="${mode==="h"}">${pad(h)}</button><span>:</span><button id="kM" aria-pressed="${mode==="m"}">${pad(m)}</button></div>
      <p style="text-align:center">${mode==="h"?"Cercle extérieur 1–12, intérieur 13–00. Glisse ou touche.":"Glisse pour régler la minute près."}</p>
      <div class="dial" id="dial"><svg viewBox="0 0 280 280">
        <defs><radialGradient id="dg"><stop offset="0" stop-color="#241540"/><stop offset="1" stop-color="#0b0614"/></radialGradient></defs>
        <circle cx="${C}" cy="${C}" r="136" fill="url(#dg)" stroke="#3b2560"/>
        <line x1="${C}" y1="${C}" x2="${hand[0]}" y2="${hand[1]}" stroke="#ff3fa4" stroke-width="3"/>
        <circle cx="${C}" cy="${C}" r="5" fill="#ff3fa4"/>
        <circle cx="${hand[0]}" cy="${hand[1]}" r="19" fill="#ff3fa4" style="filter:drop-shadow(0 0 8px #ff3fa4)"/>
        ${marks}
      </svg></div>
      <div class="actions"><button class="btn ghost" id="kBack">Retour</button><button class="btn main" id="kOk">Valider</button></div>
    `, sh => {
      sh.querySelector("#kH").onclick = () => { mode="h"; draw(); };
      sh.querySelector("#kM").onclick = () => { mode="m"; draw(); };
      sh.querySelector("#kBack").onclick = onBack;
      sh.querySelector("#kOk").onclick = () => { const n=new Date(ms); n.setHours(h,m,0,0); onOk(n.getTime()); };
      const dial = sh.querySelector("#dial");
      let dragging = false;
      const read = e => {
        const r = dial.getBoundingClientRect();
        const x = (e.clientX - r.left)/r.width*280 - C, y = (e.clientY - r.top)/r.height*280 - C;
        let a = Math.atan2(x, -y); if(a<0) a += 2*Math.PI;
        const dist = Math.hypot(x,y);
        if(mode==="h"){ const k = Math.round(a/(Math.PI/6))%12; h = dist < (RO+RI)/2 ? (k===0?0:k+12) : (k===0?12:k); }
        else m = Math.round(a/(Math.PI/30))%60;
        sh.querySelector(mode==="h"?"#kH":"#kM").textContent = pad(mode==="h"?h:m);
      };
      const live = () => {
        const svg = dial.querySelector("svg");
        const p = mode==="h" ? pos((h%12)*Math.PI/6, (h===0||h>12)?RI:RO) : pos(m*Math.PI/30, RO);
        const ln = svg.querySelector("line"), knob = svg.querySelectorAll("circle")[2];
        ln.setAttribute("x2",p[0]); ln.setAttribute("y2",p[1]); knob.setAttribute("cx",p[0]); knob.setAttribute("cy",p[1]);
      };
      dial.addEventListener("pointerdown", e => { dragging=true; dial.setPointerCapture(e.pointerId); read(e); live(); });
      dial.addEventListener("pointermove", e => { if(dragging){ read(e); live(); } });
      dial.addEventListener("pointerup", () => { if(!dragging) return; dragging=false; if(mode==="h") mode="m"; draw(); });
    });
  };
  draw();
}

/* bank */
function money(kind, id){
  const t = findT(id); if(!t || !t.bank) return;
  const b = t.bank;
  const isW = kind==="w";
  const title = kind==="d" ? "Ajouter à la tirelire" : kind==="w" ? "Retirer de la tirelire" : "Objectif d'épargne";
  openSheet(`
    <h2>${title}</h2>
    <p>${esc(t.name)}</p>
    ${isW?`<div class="warn"><svg viewBox="0 0 24 24"><use href="#lockI"/></svg><div>Ce que tu retires part dans <b>l'argent perdu</b>. Il ne s'efface proprement que si tu valides l'événement une fois le jour J passé. Disponible : <b>${fmtEUR(b.saved)}</b>.</div></div>`:""}
    <input class="inp big" id="mAmt" inputmode="decimal" placeholder="0,00 €" autofocus ${kind==="g"?`value="${String(b.goal).replace(".",",")}"`:""}>
    ${kind==="d"?`<div class="chips">${[5,10,20,50,100].map(v=>`<button class="chip" data-q="${v}">+${v} €</button>`).join("")}</div>`:""}
    ${isW?`<div class="chips"><button class="chip" data-all>Tout retirer</button></div>
    <div class="field"><span>Motif de la perte</span><div class="motifs">${MOTIFS.map(([k,l]) => `<button class="chip mot" data-mot="${k}">${l}</button>`).join("")}</div></div>`:""}
    <p class="err" id="mErr"></p>
    <div class="actions"><button class="btn ghost" id="mCancel">Annuler</button><button class="btn ${isW?"danger":"main"}" id="mOk">${isW?"Retirer pour de bon":"Valider"}</button></div>
  `, sh => {
    const inp = sh.querySelector("#mAmt"), err = sh.querySelector("#mErr");
    sh.querySelectorAll("[data-q]").forEach(c => c.onclick = () => { const cur = parseAmt(inp.value)||0; inp.value = String(r2(cur + +c.dataset.q)).replace(".",","); });
    const all = sh.querySelector("[data-all]"); if(all) all.onclick = () => { inp.value = String(b.saved).replace(".",","); };
    let mot = null;
    sh.querySelectorAll("[data-mot]").forEach(c => c.onclick = () => { mot = c.dataset.mot; sh.querySelectorAll("[data-mot]").forEach(x => x.setAttribute("aria-pressed", x === c)); });
    sh.querySelector("#mCancel").onclick = closeSheet;
    sh.querySelector("#mOk").onclick = () => {
      const v = parseAmt(inp.value);
      if(!(v > 0)){ err.textContent = "Entre un montant supérieur à 0, par exemple 25 ou 12,50."; return; }
      if(kind==="d"){ b.saved = r2(b.saved + v); b.log.push({t:Date.now(), type:"d", amt:v}); }
      else if(kind==="w"){
        if(v > b.saved){ err.textContent = `Tu ne peux pas retirer plus que ${fmtEUR(b.saved)}.`; return; }
        if(!mot){ err.textContent = "Choisis un motif pour déclarer cette perte."; return; }
        b.saved = r2(b.saved - v); state.lost = r2(state.lost + v);
        b.log.push({t:Date.now(), type:"w", amt:v, mot}); state.lostLog.push({t:Date.now(), amt:v, mot, ev:t.id, evName:t.name, why:"retrait "+t.name});
      } else { b.goal = v; }
      if(b.log.length > 300) b.log = b.log.slice(-300);
      if(state.lostLog.length > 2000) state.lostLog = state.lostLog.slice(-2000);
      t.ex = false;
      save(); render(); closeSheet();
      const el = isW ? document.getElementById("lostAmt") : document.querySelector(`[data-saved="${id}"]`); el?.classList.add("bump");
    };
  });
}

/* ---------- encrypted export / import ---------- */
const PEPPER = "PupDown·woof·7f3c91e0b5·Folsom·Darklands·Easter·2026";
const b64 = buf => btoa(String.fromCharCode(...new Uint8Array(buf)));
const unb64 = s => Uint8Array.from(atob(s), c => c.charCodeAt(0));
async function key(){
  const raw = await crypto.subtle.digest("SHA-256", new TextEncoder().encode(PEPPER));
  return crypto.subtle.importKey("raw", raw, "AES-GCM", false, ["encrypt","decrypt"]);
}
async function encryptState(){
  const iv = crypto.getRandomValues(new Uint8Array(12));
  const data = new TextEncoder().encode(JSON.stringify({...clone(state), exportedAt:Date.now()}));
  const ct = await crypto.subtle.encrypt({name:"AES-GCM", iv}, await key(), data);
  return JSON.stringify({app:"PupDown", format:2, exportedAt:new Date().toISOString(), iv:b64(iv), payload:b64(ct)}, null, 1);
}
async function decryptFile(text){
  const f = JSON.parse(text);
  if(f.app!=="PupDown" || !f.iv || !f.payload) throw new Error("bad");
  const pt = await crypto.subtle.decrypt({name:"AES-GCM", iv:unb64(f.iv)}, await key(), unb64(f.payload));
  const s = migrate(JSON.parse(new TextDecoder().decode(pt)));
  if(!valid(s)) throw new Error("bad");
  return s;
}

async function doExport(){
  let text;
  try{ text = await encryptState(); }
  catch(e){ return openSheet(`<h2>Export impossible</h2><p>Ton navigateur bloque le chiffrement. Réessaie depuis Chrome ou Safari à jour.</p><div class="actions" style="grid-template-columns:1fr"><button class="btn ghost" onclick="this.closest('.scrim').remove()">OK</button></div>`); }
  const name = `pupdown-sauvegarde-${new Date().toISOString().slice(0,10)}.json`;
  if(window.PupAndroid){ try{ if(PupAndroid.saveFile(name, text)){ exportDone(name); return; } }catch(e){} }
  let dl = null; try{ dl = window.claude?.use ? await claude.use("downloads") : null; }catch(e){}
  if(dl){
    try{ await dl.save({filename:name, data:new Blob([text],{type:"application/json"})}); exportDone(name); return; }
    catch(e){ if(e && e.code==="declined") return; }
  }
  // fallback: show the encrypted text to copy
  openSheet(`
    <h2>Ta sauvegarde chiffrée</h2>
    <p>Le téléchargement n'est pas dispo ici. Copie ce texte et colle-le dans une note ou un mail à toi-même.</p>
    <textarea class="inp" id="xTxt" readonly>${esc(text)}</textarea>
    <div class="actions"><button class="btn ghost" id="xClose">Fermer</button><button class="btn main" id="xCopy">Copier</button></div>
  `, sh => {
    sh.querySelector("#xClose").onclick = closeSheet;
    sh.querySelector("#xCopy").onclick = async () => {
      const ta = sh.querySelector("#xTxt");
      try{ await navigator.clipboard.writeText(text); sh.querySelector("#xCopy").textContent = "Copié ✓"; }
      catch(e){ ta.focus(); ta.select(); sh.querySelector("#xCopy").textContent = "Sélectionné, copie-le"; }
    };
  });
}
function exportDone(name){
  openSheet(`<h2>Sauvegarde exportée ✓</h2><p>Le fichier <b>${esc(name)}</b> est dans tes téléchargements. Garde-le dans un endroit sûr (Drive, mail à toi-même…).</p><div class="actions" style="grid-template-columns:1fr"><button class="btn main" id="eOk">Super</button></div>`, sh => sh.querySelector("#eOk").onclick = closeSheet);
}

function doImport(){
  openSheet(`
    <h2>Importer une sauvegarde</h2>
    <p>Choisis ton fichier <b>.json</b> PupDown, ou colle le texte de la sauvegarde.</p>
    <button class="btn ghost" id="iFile"><svg viewBox="0 0 24 24"><path d="M12 20V9M7 14l5-5 5 5M5 4h14"/></svg>Choisir le fichier</button>
    <textarea class="inp" id="iTxt" placeholder='{"app":"PupDown", …}'></textarea>
    <p class="err" id="iErr"></p>
    <div class="actions"><button class="btn ghost" id="iCancel">Annuler</button><button class="btn main" id="iGo">Vérifier</button></div>
  `, sh => {
    const input = document.getElementById("impFile");
    sh.querySelector("#iCancel").onclick = closeSheet;
    sh.querySelector("#iFile").onclick = () => { input.value=""; input.click(); };
    input.onchange = () => { const f = input.files[0]; if(!f) return; const r = new FileReader(); r.onload = () => tryImport(String(r.result), sh); r.readAsText(f); };
    sh.querySelector("#iGo").onclick = () => tryImport(sh.querySelector("#iTxt").value, sh);
  });
}
async function tryImport(text, sh){
  let s;
  try{ s = await decryptFile(text.trim()); }
  catch(e){ const err = sh && sh.querySelector("#iErr"); if(err) err.textContent = "Fichier refusé : il a été modifié ou ce n'est pas une sauvegarde PupDown."; return; }
  ensure(s); const lost = Math.max(s.lost, state.lost), evl = Math.max(s.eventsLost, state.eventsLost);
  openSheet(`
    <h2>Sauvegarde valide ✓</h2>
    <p>Exportée le ${fmtStamp(s.exportedAt || Date.now())} · ${s.timers.length} chrono${s.timers.length>1?"s":""}.</p>
    <div class="warn"><svg viewBox="0 0 24 24"><use href="#lockI"/></svg><div>Tes chronos actuels vont être remplacés par ceux de la sauvegarde. L'argent perdu garde le montant le plus élevé : <b>${fmtEUR(lost)}</b>.</div></div>
    <div class="actions"><button class="btn ghost" id="iNo">Refuser</button><button class="btn main" id="iYes">Accepter</button></div>
  `, sh2 => {
    sh2.querySelector("#iNo").onclick = closeSheet;
    sh2.querySelector("#iYes").onclick = () => { delete s.exportedAt; s.lost = lost; s.eventsLost = evl; state = s; save(); render(); closeSheet(); };
  });
}

/* ---------- events ---------- */
document.addEventListener("click", e => {
  const g = (sel) => e.target.closest(sel);
  let el;
  if(el = g("[data-edit]")) return editTimer(findT(el.dataset.edit), false);
  if(el = g("[data-forfeit]")) return forfeit(el.dataset.forfeit, false);
  if(el = g("[data-dep]")) return money("d", el.dataset.dep);
  if(el = g("[data-wd]")) return money("w", el.dataset.wd);
  if(el = g("[data-goal]")) return money("g", el.dataset.goal);
  if(el = g("[data-validate]")) return validateEvent(el.dataset.validate);
  const safe = fn => { try{ fn(); }catch(err){ openSheet(`<h2>Oups</h2><p>Cette fenêtre n'a pas pu s'ouvrir (${esc(err && err.message || err)}). Envoie-moi ce message, je corrige.</p><div class="actions" style="grid-template-columns:1fr"><button class="btn ghost" onclick="this.closest('.scrim').remove()">OK</button></div>`); } };
  if(g("[data-lostinfo]")) return safe(lostInfo);
  if(g("[data-evlost]")) return safe(eventsInfo);
  if(g("[data-evwon]")) return safe(wonInfo);
});
document.getElementById("addBtn").onclick = addTimer;
document.getElementById("expBtn").onclick = doExport;
document.getElementById("impBtn").onclick = doImport;

boot();
})();
