<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512">
  <defs>
    <linearGradient id="tile" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#7a2bd6"/><stop offset=".55" stop-color="#3a1170"/><stop offset="1" stop-color="#14062b"/></linearGradient>
    <radialGradient id="glow" cx=".5" cy=".62" r=".55"><stop offset="0" stop-color="#ff3fa4" stop-opacity=".55"/><stop offset="1" stop-color="#ff3fa4" stop-opacity="0"/></radialGradient>
    <linearGradient id="fur" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#ffe7c9"/><stop offset="1" stop-color="#e8a868"/></linearGradient>
    <linearGradient id="furD" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#c97a3a"/><stop offset="1" stop-color="#8a4a1c"/></linearGradient>
    <linearGradient id="kb" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#3a2a5a"/><stop offset="1" stop-color="#120a22"/></linearGradient>
    <linearGradient id="key" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#ffffff"/><stop offset=".5" stop-color="#e9ddff"/><stop offset=".52" stop-color="#b9a6e6"/><stop offset="1" stop-color="#d9ccf5"/></linearGradient>
    <linearGradient id="gloss" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#fff" stop-opacity=".55"/><stop offset="1" stop-color="#fff" stop-opacity="0"/></linearGradient>
    <filter id="neon" x="-20%" y="-20%" width="140%" height="140%"><feGaussianBlur stdDeviation="5" result="b"/><feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge></filter>
    <filter id="sh"><feDropShadow dx="0" dy="6" stdDeviation="6" flood-color="#000" flood-opacity=".55"/></filter>
    <clipPath id="tc"><rect x="16" y="16" width="480" height="480" rx="110"/></clipPath>
  </defs>
  <rect x="16" y="16" width="480" height="480" rx="110" fill="url(#tile)"/>
  <g clip-path="url(#tc)">
    <circle cx="256" cy="320" r="260" fill="url(#glow)"/>
    <g fill="#fff" opacity=".07"><circle cx="90" cy="110" r="14"/><circle cx="70" cy="86" r="7"/><circle cx="88" cy="78" r="7"/><circle cx="106" cy="82" r="7"/><circle cx="420" cy="150" r="12"/><circle cx="404" cy="130" r="6"/><circle cx="420" cy="122" r="6"/><circle cx="436" cy="128" r="6"/></g>
    <!-- coussin -->
    <ellipse cx="256" cy="470" rx="190" ry="40" fill="#ff3fa4" opacity=".35"/>
  </g>
  <g filter="url(#sh)">
    <!-- queue -->
    <path d="M352 400 C410 392 432 340 414 300 C430 350 400 380 350 378 Z" fill="url(#furD)"/>
    <!-- corps assis -->
    <path d="M176 470 C160 400 176 330 214 300 L298 300 C336 330 352 400 336 470 Z" fill="url(#fur)"/>
    <ellipse cx="256" cy="380" rx="44" ry="62" fill="#fff6ea" opacity=".9"/>
    <!-- pattes arrière -->
    <ellipse cx="190" cy="462" rx="44" ry="24" fill="url(#fur)"/>
    <ellipse cx="322" cy="462" rx="44" ry="24" fill="url(#fur)"/>
    <!-- collier néon -->
    <path d="M206 304 Q256 330 306 304" fill="none" stroke="#29e6ff" stroke-width="13" stroke-linecap="round" filter="url(#neon)"/>
    <circle cx="256" cy="330" r="11" fill="#ffd34d" stroke="#8a5a00" stroke-width="3"/>
    <!-- tête -->
    <path d="M150 140 C120 150 104 214 128 252 C142 274 168 262 172 232 Z" fill="url(#furD)"/>
    <path d="M362 140 C392 150 408 214 384 252 C370 274 344 262 340 232 Z" fill="url(#furD)"/>
    <ellipse cx="256" cy="200" rx="104" ry="96" fill="url(#fur)"/>
    <ellipse cx="256" cy="246" rx="58" ry="42" fill="#fff6ea"/>
    <path d="M214 120 Q256 96 298 120 Q284 150 256 150 Q228 150 214 120Z" fill="#e8a868" opacity=".55"/>
    <!-- yeux -->
    <ellipse cx="214" cy="196" rx="18" ry="22" fill="#1a0b2e"/><ellipse cx="298" cy="196" rx="18" ry="22" fill="#1a0b2e"/>
    <circle cx="220" cy="188" r="7" fill="#fff"/><circle cx="304" cy="188" r="7" fill="#fff"/>
    <circle cx="209" cy="204" r="3.5" fill="#fff" opacity=".8"/><circle cx="293" cy="204" r="3.5" fill="#fff" opacity=".8"/>
    <ellipse cx="194" cy="232" rx="14" ry="8" fill="#ff7ab8" opacity=".55"/><ellipse cx="318" cy="232" rx="14" ry="8" fill="#ff7ab8" opacity=".55"/>
    <!-- truffe + bouche + langue -->
    <ellipse cx="256" cy="232" rx="20" ry="14" fill="#1a0b2e"/><ellipse cx="250" cy="227" rx="7" ry="4" fill="#fff" opacity=".6"/>
    <path d="M256 246 V258 M256 258 Q240 272 226 262 M256 258 Q272 272 286 262" fill="none" stroke="#1a0b2e" stroke-width="5" stroke-linecap="round"/>
    <path d="M248 264 Q256 290 266 264 Z" fill="#ff5e9e" stroke="#c2185b" stroke-width="2"/>
    <!-- harnais / clous -->
    <circle cx="232" cy="314" r="4" fill="#fff"/><circle cx="280" cy="314" r="4" fill="#fff"/>
  </g>
  <!-- clavier tenu -->
  <g filter="url(#sh)" transform="rotate(-6 256 380)">
    <rect x="148" y="342" width="216" height="92" rx="16" fill="url(#kb)" stroke="#ff3fa4" stroke-width="5" filter="url(#neon)"/>
    <g fill="url(#key)">
      <rect x="162" y="356" width="26" height="20" rx="5"/><rect x="194" y="356" width="26" height="20" rx="5"/><rect x="226" y="356" width="26" height="20" rx="5"/><rect x="258" y="356" width="26" height="20" rx="5"/><rect x="290" y="356" width="26" height="20" rx="5"/><rect x="322" y="356" width="28" height="20" rx="5"/>
      <rect x="170" y="382" width="26" height="20" rx="5"/><rect x="202" y="382" width="26" height="20" rx="5"/><rect x="234" y="382" width="26" height="20" rx="5"/><rect x="266" y="382" width="26" height="20" rx="5"/><rect x="298" y="382" width="44" height="20" rx="5"/>
      <rect x="194" y="408" width="124" height="16" rx="5"/>
    </g>
    <rect x="234" y="382" width="26" height="20" rx="5" fill="#ff3fa4" filter="url(#neon)"/>
    <!-- pattes avant posées dessus -->
    <ellipse cx="166" cy="372" rx="30" ry="24" fill="url(#fur)" stroke="#c97a3a" stroke-width="3"/>
    <ellipse cx="346" cy="372" rx="30" ry="24" fill="url(#fur)" stroke="#c97a3a" stroke-width="3"/>
    <g fill="#c97a3a"><path d="M150 360v14M164 356v16M178 360v14" stroke="#c97a3a" stroke-width="3" stroke-linecap="round"/><path d="M334 360v14M348 356v16M362 360v14" stroke="#c97a3a" stroke-width="3" stroke-linecap="round"/></g>
  </g>
  <!-- verre Vista -->
  <path d="M16 126 Q16 16 126 16 H386 Q496 16 496 126 V200 Q256 250 16 200 Z" fill="url(#gloss)" opacity=".55"/>
  <rect x="16" y="16" width="480" height="480" rx="110" fill="none" stroke="#fff" stroke-opacity=".7" stroke-width="5"/>
</svg>
