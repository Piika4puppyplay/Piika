<!doctype html>
<html lang="fr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no,viewport-fit=cover">
<title>La sieste du chiot</title>
<link rel="stylesheet" href="style.css">
<link rel="stylesheet" href="sieste.css">
</head>
<body class="sieste">
<div class="sky" aria-hidden="true"><div id="stars"></div><div class="floor"></div></div>
<div id="wrap">
  <div id="pup"></div>
  <div class="sbatt" id="sbatt">
    <div class="bin">
      <div class="fill" id="fill"><svg class="wave" viewBox="0 0 20 200" preserveAspectRatio="none"><path id="wpath" d=""/></svg><div id="bubbles"></div></div>
      <div class="sglass"></div>
      <div class="clock"><b id="hh">00</b><i id="colon">:</i><b id="mm">00</b></div>
      <div class="pct" id="pct">— %</div>
      <div class="sbolt" id="sbolt"><svg viewBox="0 0 24 36"><path d="M14 1L2 21h8l-3 14 15-22h-9z"/></svg></div>
    </div>
    <i class="nub"></i><i class="rv r1"></i><i class="rv r2"></i><i class="rv r3"></i><i class="rv r4"></i>
  </div>
  <div class="date" id="date"></div>
  <div class="say" id="say"></div>
</div>
<script src="sieste.js"></script>
</body>
</html>
